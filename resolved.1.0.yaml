                    dateOfLastSubscription:
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      type: string
                      description: Date of last subscription to the ISA account (YYYY-MM-DD).
                      format: date
                      example: 2025-05-01
                    totalCurrentYearSubscriptionsToDate:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: Total value of current-year subscriptions to the
                        ISA account.
                      format: double
                      example: 5000.0
                    marketValueOfAccount:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: The market value of the ISA account.
                      format: double
                      example: 10000.0
                    isaType:
                      type: string
                      description: The type of ISA account.
                      example: LIFETIME
                      enum:
                      - LIFETIME
                    dateOfFirstSubscription:
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      type: string
                      description: Date of first subscription to the ISA account (YYYY-MM-DD).
                      format: date
                      example: 2025-04-06
                    closureDate:
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      type: string
                      description: ISA account closure date (YYYY-MM-DD).
                      format: date
                      example: 2025-05-15
                    reasonForClosure:
                      type: string
                      description: The reason for the closure of the ISA account.
                      enum:
                      - CANCELLED
                      - CLOSED
                      - VOID
