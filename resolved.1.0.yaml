        required: true
      responses:
        "204":
          description: Submission accepted. No content returned.
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - title: Bad Request (General Issue)
                  type: object
                  properties:
                    code:
                      title: Validation Failure Code
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - MISSING_NINO_OR_ACC_NUM
                      - INVALID_NINO_OR_ACC_NUM
                      - INVALID_TAX_YEAR
                      - INVALID_MONTH
                      - INVALID_Z_REFERENCE
                      - MALFORMED_JSON
                      - EMPTY_PAYLOAD
                    message:
                      title: Detailed Message
                      type: string
                      description: Message describing the details of the validation
                        error.
                - title: Bad Request (Field Specific)
                  type: object
                  properties:
                    code:
                      title: Validation Failure
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - VALIDATION_FAILURE
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: One or more models failed validation
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found in the format
                        of a record. (This will outline only the first issue.)
                      items:
                        anyOf:
                        - title: Bad Request Item
                          type: object
                          properties:
                            nino:
                              title: National Insurance Number
                              type: string
                              description: National Insurance number associated with
                                the record failing validation.
                            accountNumber:
                              title: Account Number
                              type: string
                              description: Account Number associated with the record
                                failing validation.
                            code:
                              title: Validation Failure
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - INVALID_FIELD
                              - MISSING_FIELD
                              - DUPLICATE_FIELD
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Last name field is missing
                - title: Bad Request (Parameters)
                  type: object
                  properties:
                    code:
                      title: Parameter Failure Code
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - INVALID_Z_REFERENCE
                      - INVALID_TAX_YEAR
                      - INVALID_MONTH
                    message:
                      title: Parameter Failure Message
                      type: string
                      description: Message describing the error in more detail.
                      example: Invalid parameter for month
                - title: Bad Request Parameters (Multiple Errors)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - BAD_REQUEST
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Multiple issues found regarding your submission
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found regarding
                        your submission.
                      example:
                      - code: INVALID_TAX_YEAR
                        message: Invalid tax year provided
                      - code: INVALID_MONTH
                        message: Invalid month provided
                      items:
                        anyOf:
                        - title: Invalid Tax Year
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - INVALID_TAX_YEAR
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Invalid tax year provided
                        - title: Invalid Month
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - INVALID_MONTH
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Invalid month provided
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                - title: Forbidden (Single Error)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      enum:
                      - REPORTING_WINDOW_CLOSED
                      - OBLIGATION_CLOSED
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Reporting window has been closed
                - title: Forbidden (Multiple Errors)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - FORBIDDEN
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Multiple issues found regarding your submission
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found regarding
                        your submission.
                      example:
                      - code: OBLIGATION_CLOSED
                        message: Obligation closed
                      - code: REPORTING_WINDOW_CLOSED
                        message: Reporting window has been closed
                      items:
                        anyOf:
                        - title: Obligation Closed
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - OBLIGATION_CLOSED
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Obligation Closed
                        - title: Reporting Window Closed
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - REPORTING_WINDOW_CLOSED
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Reporting window has been closed
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Unexpected Error
      security:
      - userRestricted:
        - write:isa-returns
  /monthly/{zReference}/{taxYear}/{month}/declaration:
    post:
      tags:
      - Submit monthly report
      summary: Declare monthly report as complete
      description: "Use this endpoint to confirm that all data has been submitted.\
        \ \n\nDeclaring a report as complete is a legal confirmation that your \n\
        monthly reporting obligations are met. It confirms that all \nrequired data\
        \ has been filed by the deadline, but it is not an \nattestation that the\
        \ submitted data is correct. \nAfter this step, no further data can be added\
        \ for that month. \n\nThe API checks whether the reporting window is open\
        \ and whether a report has \nalready been submitted for the specified tax\
        \ year and report month. \nIf either condition is not met, the API returns\
        \ a `403 Forbidden` response.\n\nIf the submission completes successfully,\
        \ the response includes:\n- a confirmation that the report is complete\n-\
        \ a URL to retrieve the results summary after the reporting window closes\n\
        - a box ID for the Push-Pull Notifications Service (PPNS)\n"
      operationId: declareMonthlyReportComplete
      parameters:
      - name: zReference
        in: path
        description: |
          A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[z|Z][0-9]{4}$"
          type: string
          example: Z1234
      - name: taxYear
        in: path
        description: |
          Tax year of the report.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^20\\d{2}-\\d{2}$"
          format: string
          example: 2025-26
      - name: month
        in: path
        description: |
          Month of the report.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: APR
          enum:
          - JAN
          - FEB
          - MAR
          - APR
          - MAY
          - JUN
          - JUL
          - AUG
          - SEP
          - OCT
          - NOV
          - DEC
      - name: Accept
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: Bearer token for authentication.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - nilReturn
              type: object
              properties:
                nilReturn:
                  type: boolean
                  description: |
                    If `true`, this indicates a nil return: there is no data to report for the period.
                    It acts as a declaration alongside the general declaration and will override any previous submission for the same period.
                    If `false`, the API expects data records to have been submitted separately before completion.
        required: true
      responses:
        "200":
          description: Submission completed. Reconciliation results will be available
            after processing is complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportResultsSummaryLocation:
                    type: string
                    description: Use this URL to retrieve the report results summary
                      once the reporting window closes.
                    format: uri
                    example: https://test-api.service.hmrc.gov.uk/obligations/declaration/isa/return/monthly/Z1234/2025-26/APR/results/summary
                  boxId:
                    type: string
                    description: Unique identifier of the PPNS box in use for notifications.
                    format: guid
                    example: 1c5b9365-18a6-55a5-99c9-83a091ac7f26
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - title: Bad Request (General Issue)
                  type: object
                  properties:
                    code:
                      title: Validation Failure Code
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - MALFORMED_JSON
                      - DUPLICATE_FIELD
                      - MISSING_NIL_RETURN
                    message:
                      title: Detailed Message
                      type: string
                      description: Message describing the details of the validation
                        error.
                - title: Bad Request Parameters (Multiple Errors)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - BAD_REQUEST
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Multiple issues found regarding your submission
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found regarding
                        your submission.
                      example:
                      - code: INVALID_TAX_YEAR
                        message: Invalid tax year provided
                      - code: INVALID_MONTH
                        message: Invalid month provided
                      items:
                        anyOf:
                        - title: Invalid Tax Year
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - INVALID_TAX_YEAR
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Invalid tax year provided
                        - title: Invalid Month
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - INVALID_MONTH
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Invalid month provided
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Types
                    type: string
                    description: Error Code
                    enum:
                    - UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                - title: Forbidden (Single Error)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      enum:
                      - REPORTING_WINDOW_CLOSED
                      - OBLIGATION_CLOSED
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Reporting window has been closed
                - title: Forbidden (Multiple Errors)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - FORBIDDEN
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Multiple issues found regarding your submission
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found regarding
                        your submission.
                      example:
                      - code: OBLIGATION_CLOSED
                        message: Obligation closed
                      - code: REPORTING_WINDOW_CLOSED
                        message: Reporting window has been closed
                      items:
                        anyOf:
                        - title: Obligation Closed
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - OBLIGATION_CLOSED
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Obligation Closed
                        - title: Reporting Window Closed
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - REPORTING_WINDOW_CLOSED
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Reporting window has been closed
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - MONTHLY_RETURN_NOT_SUBMITTED
                  message:
                    type: string
                    example: Cannot declare with nilReturn as false when no monthly
                      return data has been submitted
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Unexpected Error
      security:
      - userRestricted:
        - write:isa-returns
  /monthly/{zReference}/{taxYear}/{month}/results/summary:
    get:
      tags:
      - Check report results
      summary: Get report summary
      description: "After you submit a monthly report, HMRC processes the data and\
        \ generates a results summary, \nwhich provides high-level information about\
        \ the submission. \nYou can access a results summary only after the reporting\
        \ window closes. \nUse this endpoint to find out whether the results summary\
        \ is available for a submitted report.\n\nIf the request is successful, the\
        \ response includes:\n- a URL to retrieve the results summary\n- pagination\
        \ details, including total records and total pages\n\nIf the results summary\
        \ is not yet available or the report is not found, the API returns a `404\
        \ Not Found` response.\n"
      operationId: getReportSummaryStatus
      parameters:
      - name: zReference
        in: path
        description: |
          A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[z|Z][0-9]{4}$"
          type: string
          example: Z1234
      - name: taxYear
        in: path
        description: |
          Tax year of the report.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^20\\d{2}-\\d{2}$"
          format: string
          example: 2025-26
      - name: month
        in: path
        description: |
          Month of the report.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: APR
          enum:
          - JAN
          - FEB
          - MAR
          - APR
          - MAY
          - JUN
          - JUL
          - AUG
          - SEP
          - OCT
          - NOV
          - DEC
      - name: Accept
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: Bearer token for authentication.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Results are now available for the specified monthly report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  returnResultsLocation:
                    type: string
                    description: Use this URL to retrieve the results of the specified
                      report.
                    format: uri
                    example: https://test-api.service.hmrc.gov.uk/obligations/declaration/isa/return/monthly/Z1234/2025-26/APR/results?page=1
                  totalRecords:
                    type: integer
                    description: Total number of records in the report results.
                    example: 10000
                  numberOfPages:
                    type: integer
                    description: Total number of pages in the result set.
                    example: 2
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - title: Bad Request (Parameters)
                  type: object
                  properties:
                    code:
                      title: Parameter Failure Code
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - INVALID_Z_REFERENCE
                      - INVALID_TAX_YEAR
                      - INVALID_MONTH
                    message:
                      title: Parameter Failure Message
                      type: string
                      description: Message describing the error in more detail.
                      example: Invalid parameter for month
                - title: Bad Request Parameters (Multiple Errors)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - BAD_REQUEST
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Multiple issues found regarding your submission
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found regarding
                        your submission.
                      example:
                      - code: INVALID_TAX_YEAR
                        message: Invalid tax year provided
                      - code: INVALID_MONTH
                        message: Invalid month provided
                      items:
                        anyOf:
                        - title: Invalid Tax Year
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - INVALID_TAX_YEAR
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
