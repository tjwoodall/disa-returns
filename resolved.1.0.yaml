                    lisaQualifyingAddition:
                      pattern: "^-?\\d+\\.\\d{2}$"
                      type: number
                      description: The amount of the current subscription that qualifies
                        for a LISA bonus.
                      format: double
                      example: 1000.0
                    lisaBonusClaim:
                      pattern: "^-?\\d+\\.\\d{2}$"
                      type: number
                      description: The amount being claimed as a LISA bonus.
                      format: double
                      example: 1000.0
                - required:
                  - accountNumber
                  - amountTransferredIn
                  - amountTransferredOut
                  - dateOfBirth
                  - dateOfLastSubscription
                  - firstName
                  - flexibleIsa
                  - isaType
                  - lastName
                  - marketValueOfAccount
                  - nino
                  - totalCurrentYearSubscriptionsToDate
                  type: object
