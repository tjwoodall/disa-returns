  parameters:
    acceptHeader:
      name: Accept
      in: header
      required: true
      style: simple
      explode: false
      schema:
        type: string
        enum:
        - application/vnd.hmrc.1.0+json
    authorizationHeader:
      name: Authorization
      in: header
      description: Bearer token for authentication.
      required: true
      style: simple
      explode: false
      schema:
        type: string
