        required: true
      responses:
        "204":
          description: Submission accepted. No content returned.
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - title: Bad Request (General Issue)
                  type: object
                  properties:
                    code:
                      title: Validation Failure Code
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - MISSING_NINO_OR_ACC_NUM
                      - INVALID_NINO_OR_ACC_NUM
                      - INVALID_Z_REFERENCE
                      - MALFORMED_JSON
                      - EMPTY_PAYLOAD
                    message:
                      title: Detailed Message
                      type: string
                      description: Message describing the details of the validation
                        error.
                - title: Bad Request (Field Specific)
                  type: object
                  properties:
                    code:
                      title: Validation Failure
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - VALIDATION_FAILURE
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: One or more models failed validation
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found in the format
                        of a record. (This will outline only the first issue.)
                      items:
                        anyOf:
                        - title: Bad Request Item
                          type: object
                          properties:
                            nino:
                              title: National Insurance Number
                              type: string
                              description: National Insurance number associated with
                                the record failing validation.
                            accountNumber:
                              title: Account Number
                              type: string
                              description: Account Number associated with the record
                                failing validation.
                            code:
                              title: Validation Failure
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - INVALID_FIELD
                              - MISSING_FIELD
                              - DUPLICATE_FIELD
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Last name field is missing
                - title: Bad Request (Parameters)
                  type: object
                  properties:
                    code:
                      title: Parameter Failure Code
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - INVALID_Z_REFERENCE
                    message:
                      title: Parameter Failure Message
                      type: string
                      description: Message describing the error in more detail.
                      example: Z reference is not formatted correctly
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                - title: Forbidden (Single Error)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      enum:
                      - REPORTING_WINDOW_CLOSED
                      - OBLIGATION_CLOSED
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Reporting window has been closed
                - title: Forbidden (Multiple Errors)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - FORBIDDEN
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Multiple issues found regarding your submission
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found regarding
                        your submission.
                      example:
                      - code: OBLIGATION_CLOSED
                        message: Obligation closed
                      - code: REPORTING_WINDOW_CLOSED
                        message: Reporting window has been closed
                      items:
                        anyOf:
                        - title: Obligation Closed
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - OBLIGATION_CLOSED
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Obligation Closed
                        - title: Reporting Window Closed
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - REPORTING_WINDOW_CLOSED
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Reporting window has been closed
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Unexpected Error
      security:
      - userRestricted:
        - write:isa-returns
  /monthly/{zReference}/declaration:
    post:
      tags:
      - Submit monthly report
      summary: Declare monthly report as complete
      description: "Use the ‘Declare monthly report as complete’ endpoint to confirm\
        \ that all data has been submitted.\n\nDeclaring a report as complete is a\
        \ legal confirmation that you have met your monthly reporting obligation by\
        \ \nsubmitting all available data within the deadline. However, it does not\
        \ confirm that the submitted data is \ncorrect. Once the monthly declaration\
        \ is submitted, no further data can be submitted for that specific month.\n\
        \nThe API checks whether:\n\n- the reporting window is closed\n- a declaration\
        \ has already been submitted for the current reporting period\n\nIf either\
        \ of the above conditions are satisfied, then the API returns a `403 Forbidden`\
        \ response.\n\nIf the submission completes successfully, the response includes\
        \ a box ID for the \n[Push-Pull Notifications Service (PPNS)](https://developer.service.hmrc.gov.uk/api-documentation/docs/api/service/push-pull-notifications-api/1.0).\
        \ \nThe box ID can be used to query the PPNS API directly to retrieve the\
        \ reconciliation results.\n"
      operationId: declareMonthlyReportComplete
      parameters:
      - name: zReference
        in: path
        description: |
          A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[zZ][0-9]{4}$"
          type: string
          example: Z1234
      - name: Accept
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: Bearer token for authentication.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - nilReturn
              type: object
              properties:
                nilReturn:
                  type: boolean
                  description: |
                    If `true`, this indicates a nil return: there is no data to report for the period.
                    It acts as a declaration alongside the general declaration and will override any previous submission for the same period.
                    If `false`, the API expects data records to have been submitted separately before completion.
        required: true
      responses:
        "200":
          description: Submission completed. Reconciliation results will be available
            after processing is complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  boxId:
                    type: string
                    description: Unique identifier of the PPNS box in use for notifications.
                    format: guid
                    example: 1c5b9365-18a6-55a5-99c9-83a091ac7f26
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - title: Bad Request (General Issue)
                  type: object
                  properties:
                    code:
                      title: Validation Failure Code
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - MALFORMED_JSON
                      - DUPLICATE_FIELD
                      - MISSING_NIL_RETURN
                    message:
                      title: Detailed Message
                      type: string
                      description: Message describing the details of the validation
                        error.
                - title: Bad Request (Parameters)
                  type: object
                  properties:
                    code:
                      title: Parameter Failure Code
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - INVALID_Z_REFERENCE
                    message:
                      title: Parameter Failure Message
                      type: string
                      description: Message describing the error in more detail.
                      example: Z reference is not formatted correctly
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Types
                    type: string
                    description: Error Code
                    enum:
                    - UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                - title: Forbidden (Single Error)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      enum:
                      - REPORTING_WINDOW_CLOSED
                      - OBLIGATION_CLOSED
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Reporting window has been closed
                - title: Forbidden (Multiple Errors)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - FORBIDDEN
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Multiple issues found regarding your submission
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found regarding
                        your submission.
                      example:
                      - code: OBLIGATION_CLOSED
                        message: Obligation closed
                      - code: REPORTING_WINDOW_CLOSED
                        message: Reporting window has been closed
                      items:
                        anyOf:
                        - title: Obligation Closed
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - OBLIGATION_CLOSED
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Obligation Closed
                        - title: Reporting Window Closed
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code indicating the type of error.
                              enum:
                              - REPORTING_WINDOW_CLOSED
                            message:
                              title: Message
                              type: string
                              description: Human-readable message outlining the error.
                              example: Reporting window has been closed
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - MONTHLY_RETURN_NOT_SUBMITTED
                  message:
                    type: string
                    example: Cannot declare with nilReturn as false when no monthly
                      return data has been submitted
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Unexpected Error
      security:
      - userRestricted:
        - write:isa-returns
  /monthly/{zReference}/results:
    get:
      tags:
      - Check report results
      summary: Get report reconciliation results
      description: "After processing is complete, use the ‘Get report reconciliation\
        \ results’ endpoint to retrieve the reconciliation \nresults for the monthly\
        \ report. The API returns reconciliation results using cursor pagination.\
        \ These \nreconciliation results show the records that were rejected, including\
        \ error messages where applicable.\n\nThe cursor and limit query parameters\
        \ are optional. The limit defaults to 200 records per page. To retrieve the\
        \ \nnext batch, pass the nextCursor value from the previous response as the\
        \ cursor parameter.\n\nIf the request is successful, the response includes:\n\
        \n- the reconciliation results for the current batch, including record-level\
        \ identifiers and any reconciliation \nerrors\n- the nextCursor value when\
        \ more results are available; it is omitted for the final batch\n\nIf the\
        \ reconciliation results are not yet available or the report is not found,\
        \ the API returns a `404 Not Found` \nresponse.\n"
      operationId: getReportReconciliationResults
      parameters:
      - name: zReference
        in: path
        description: |
          A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[zZ][0-9]{4}$"
          type: string
          example: Z1234
      - name: cursor
        in: query
        description: |
          Cursor returned as nextCursor in the previous response. Omit for the first request.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: AbCdEf0123_-xyz
      - name: limit
        in: query
        description: Maximum number of results to return. Defaults to 200.
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          example: 200
          default: 200
      - name: Accept
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: Bearer token for authentication.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: A batch of reconciliation results from the monthly report.
          content:
            application/json:
              schema:
                required:
                - returnResults
                type: object
                properties:
                  returnResults:
                    type: array
                    description: Reconciliation results in the current batch.
                    items:
                      type: object
                      properties:
                        accountNumber:
                          type: string
                          description: The account number of the ISA account.
                          example: "12345678"
                        nino:
                          pattern: "^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$"
                          type: string
                          description: The National Insurance number of the account
                            holder.
                          example: AB123456C
                        issueIdentified:
                          oneOf:
                          - type: object
                            properties:
                              code:
                                type: string
                                description: The result of the report submission.
                                example: OVER_SUBSCRIBED
                                enum:
                                - OVER_SUBSCRIBED
                              overSubscribedAmount:
                                pattern: "^\\d+\\.\\d{2}$"
                                type: number
                                description: The amount that was over-subscribed.
                                format: double
                                example: 1000.0
                          - type: object
                            properties:
                              code:
                                type: string
                                description: The result of the report submission.
                                example: UNABLE_TO_IDENTIFY_INVESTOR
                                enum:
                                - UNABLE_TO_IDENTIFY_INVESTOR
                              message:
                                type: string
                                description: The reason for the inability to identify
                                  the investor.
                                example: The National Insurance number provided does
                                  not match any records.
                          - type: object
                            properties:
                              code:
                                type: string
                                description: The result of the report submission.
                                example: INELIGIBLE
                                enum:
                                - INELIGIBLE
                              message:
                                type: string
                                description: The reason for the state eligibility.
                                example: This account holder is too young
                  nextCursor:
                    type: string
                    description: Encrypted URL-safe cursor for the next batch. Omitted
                      when this is the final batch.
                    example: AbCdEf0123_-xyz
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - title: Bad Request (Pagination Parameters)
                  type: object
                  properties:
                    code:
                      title: Parameter Failure Code
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - INVALID_Z_REFERENCE
                      - INVALID_LIMIT
                      - INVALID_CURSOR
                    message:
                      title: Parameter Failure Message
                      type: string
                      description: Message describing the error in more detail.
                      example: Invalid limit parameter provided
                - title: Bad Request Parameters (Multiple Errors)
                  type: object
                  properties:
                    code:
                      title: Error Code Type
                      type: string
                      description: Code indicating the type of error.
                      enum:
                      - BAD_REQUEST
                    message:
                      title: Message
                      type: string
                      description: Human-readable message outlining the error.
                      example: Multiple issues found regarding your submission
                    errors:
                      title: Errors
                      type: array
                      description: Array of errors outlining issues found regarding
                        your submission.
                      example:
                      - code: INVALID_Z_REFERENCE
                        message: Z reference is not formatted correctly
                      - code: INVALID_LIMIT
                        message: Invalid limit parameter provided
                      items:
                        title: Bad Request (Pagination Parameters)
                        type: object
                        properties:
                          code:
                            title: Parameter Failure Code
                            type: string
                            description: Code indicating the type of error.
                            enum:
                            - INVALID_Z_REFERENCE
                            - INVALID_LIMIT
                            - INVALID_CURSOR
                          message:
                            title: Parameter Failure Message
                            type: string
                            description: Message describing the error in more detail.
                            example: Invalid limit parameter provided
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Types
                    type: string
                    description: Types of errors encountered.
                    enum:
                    - REPORT_NOT_FOUND
                  message:
                    type: string
                    example: Report not found
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Unexpected Error
      security:
      - userRestricted:
        - read:isa-returns
