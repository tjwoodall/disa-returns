  /monthly/{zReference}/{taxYear}/{month}/results:
    get:
      tags:
      - Check report results
      summary: Get report reconciliation results
      description: "After the results summary is available, use this endpoint to retrieve\
        \ the reconciliation results for the monthly report. \nThe API returns reconciliation\
        \ results in paginated batches. \nThese show which records were accepted and\
        \ which were rejected, including error messages where applicable.\n\nOptionally,\
        \ include a page query parameter to request a specific page of results.\n\n\
        If the request is successful, the response includes:\n- pagination information,\
        \ including page number, total pages, and total records\n- the reconciliation\
        \ results for the current page, including record-level identifiers and any\
        \ reconciliation errors\n\nIf the reconciliation results are not yet available,\
        \ or if the specified page or report is not found, \nthe API returns a `404\
        \ Not Found` response.\n"
      operationId: getReportReconciliationResults
      parameters:
      - name: zReference
        in: path
        description: |
          A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[z|Z][0-9]{4}$"
          type: string
          example: Z1234
      - name: taxYear
        in: path
        description: |
          Tax year of the report.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^20\\d{2}-\\d{2}$"
          format: string
          example: 2025-26
      - name: month
        in: path
        description: |
          Month of the report.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: APR
          enum:
          - JAN
          - FEB
          - MAR
          - APR
          - MAY
          - JUN
          - JUL
          - AUG
          - SEP
          - OCT
          - NOV
          - DEC
      - name: page
        in: query
        description: |
          Page of records in the report to return. Defaults to 0.
        required: false
        style: form
        explode: true
        schema:
          type: number
          example: 3
      - name: Accept
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: Bearer token for authentication.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Reconciliation results for the specified page of the monthly
            report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentPage:
                    type: integer
                    description: The page number of the results.
                    example: 1
                  recordsInPage:
                    type: integer
                    description: The number of records in the current page.
                    example: 8000
                  totalRecords:
                    type: integer
                    description: Total number of records in the report results.
                    example: 10000
                  totalNumberOfPages:
                    type: integer
                    description: Total number of pages to return all results.
                    example: 2
                  returnResults:
                    type: array
                    description: The report results for the specified page.
                    items:
                      type: object
                      properties:
                        accountNumber:
                          type: string
                          description: The account number of the ISA account.
                          example: "12345678"
                        nino:
                          pattern: "^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$"
                          type: string
                          description: The National Insurance number of the account
                            holder.
                          example: AB123456C
                        issueIdentified:
                          oneOf:
                          - type: object
                            properties:
                              code:
                                type: string
                                description: The result of the report submission.
                                example: OVER_SUBSCRIBED
                                enum:
                                - OVER_SUBSCRIBED
                              overSubscribedAmount:
                                pattern: "^\\d+\\.\\d{2}$"
                                type: number
                                description: The amount that was over-subscribed.
                                format: double
                                example: 1000.0
                          - type: object
                            properties:
                              code:
                                type: string
                                description: The result of the report submission.
                                example: UNABLE_TO_IDENTIFY_INVESTOR
                                enum:
                                - UNABLE_TO_IDENTIFY_INVESTOR
                              message:
                                type: string
                                description: The reason for the inability to identify
                                  the investor.
                                example: The National Insurance number provided does
                                  not match any records.
                          - type: object
                            properties:
                              code:
                                type: string
                                description: The result of the report submission.
                                example: INELIGIBLE
                                enum:
                                - INELIGIBLE
                              message:
                                type: string
                                description: The reason for the state eligibility.
                                example: This account holder is too young
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Parameter Failure Code
                    type: string
                    description: Code indicating the type of error.
                    enum:
                    - INVALID_Z_REFERENCE
                    - INVALID_TAX_YEAR
                    - INVALID_MONTH
                    - INVALID_PAGE
                  message:
                    title: Description of error
                    type: string
                    description: Message describing error detail.
                    example: Page number A5 is invalid
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Types
                    type: string
                    description: Types of errors encountered.
                    enum:
                    - REPORT_NOT_FOUND
                    - PAGE_NOT_FOUND
                  message:
                    type: string
                    enum:
                    - Report not found
                    - "No page {pageNumber} found"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Unexpected Error
      security:
      - userRestricted:
        - read:isa-returns
components:
  schemas:
    investorDetailsBase:
      title: Investor Details (Base)
      required:
      - accountNumber
      - amountTransferredIn
      - amountTransferredOut
      - dateOfBirth
      - dateOfLastSubscription
      - firstName
      - lastName
      - marketValueOfAccount
      - nino
      - totalCurrentYearSubscriptionsToDate
      type: object
      properties:
        accountNumber:
          type: string
          description: The account number of the ISA account.
          example: "12345678"
        nino:
          pattern: "^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$"
          type: string
          description: The National Insurance number of the account holder.
          example: AB123456C
        firstName:
          type: string
          description: The first name of the account holder.
          example: John
        middleName:
          type: string
          description: The middle name of the account holder.
        lastName:
          type: string
          description: The last name of the account holder.
          example: Smith
        dateOfBirth:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
          description: The date of birth of the account holder (YYYY-MM-DD).
          format: date
          example: 1980-01-01
        amountTransferredIn:
          pattern: "^\\d+\\.\\d{2}$"
          type: number
          description: Total value transferred in.
          format: double
          example: 3000.0
        amountTransferredOut:
          pattern: "^\\d+\\.\\d{2}$"
          type: number
          description: Total value transferred out.
          format: double
          example: 3000.0
        dateOfLastSubscription:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
          description: Date of last subscription to the ISA account (YYYY-MM-DD).
          format: date
          example: 2025-05-01
        totalCurrentYearSubscriptionsToDate:
          pattern: "^\\d+\\.\\d{2}$"
          type: number
          description: Total value of current-year subscriptions to the ISA account.
          format: double
          example: 5000.0
        marketValueOfAccount:
          pattern: "^\\d+\\.\\d{2}$"
          type: number
          description: The market value of the ISA account.
          format: double
          example: 10000.0
    investorDetails:
      title: Investor Details
      type: object
      anyOf:
      - required:
        - accountNumber
        - amountTransferredIn
        - amountTransferredOut
        - dateOfBirth
        - dateOfFirstSubscription
        - dateOfLastSubscription
        - firstName
        - isaType
        - lastName
        - lisaBonusClaim
        - lisaQualifyingAddition
        - marketValueOfAccount
        - nino
        - totalCurrentYearSubscriptionsToDate
        type: object
        properties:
          accountNumber:
            type: string
            description: The account number of the ISA account.
            example: "12345678"
          nino:
            pattern: "^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$"
            type: string
            description: The National Insurance number of the account holder.
            example: AB123456C
          firstName:
            type: string
            description: The first name of the account holder.
            example: John
          middleName:
            type: string
            description: The middle name of the account holder.
          lastName:
            type: string
            description: The last name of the account holder.
            example: Smith
          dateOfBirth:
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
            type: string
            description: The date of birth of the account holder (YYYY-MM-DD).
            format: date
            example: 1980-01-01
          amountTransferredIn:
            pattern: "^\\d+\\.\\d{2}$"
            type: number
            description: Total value transferred in.
            format: double
            example: 3000.0
          amountTransferredOut:
            pattern: "^\\d+\\.\\d{2}$"
            type: number
            description: Total value transferred out.
            format: double
            example: 3000.0
          dateOfLastSubscription:
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
            type: string
            description: Date of last subscription to the ISA account (YYYY-MM-DD).
            format: date
            example: 2025-05-01
          totalCurrentYearSubscriptionsToDate:
            pattern: "^\\d+\\.\\d{2}$"
            type: number
            description: Total value of current-year subscriptions to the ISA account.
            format: double
            example: 5000.0
          marketValueOfAccount:
            pattern: "^\\d+\\.\\d{2}$"
            type: number
            description: The market value of the ISA account.
            format: double
            example: 10000.0
          isaType:
            type: string
            description: The type of ISA account.
            example: LIFETIME
            enum:
            - LIFETIME
          dateOfFirstSubscription:
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
            type: string
            description: Date of first subscription to the ISA account (YYYY-MM-DD).
            format: date
            example: 2025-04-06
          lisaQualifyingAddition:
            pattern: "^-?\\d+\\.\\d{2}$"
            type: number
            description: The amount of the current subscription that qualifies for
              a LISA bonus.
            format: double
            example: 1000.0
          lisaBonusClaim:
            pattern: "^-?\\d+\\.\\d{2}$"
            type: number
            description: The amount being claimed as a LISA bonus.
            format: double
            example: 1000.0
      - required:
        - accountNumber
        - amountTransferredIn
        - amountTransferredOut
        - closureDate
        - dateOfBirth
        - dateOfFirstSubscription
        - dateOfLastSubscription
        - firstName
        - isaType
        - lastName
        - lisaBonusClaim
        - lisaQualifyingAddition
        - marketValueOfAccount
        - nino
        - reasonForClosure
        - totalCurrentYearSubscriptionsToDate
        type: object
        properties:
          accountNumber:
            type: string
            description: The account number of the ISA account.
            example: "12345678"
          nino:
