openapi: 3.0.3
info:
  title: ISA Returns API
  description: "# Overview\nUse this API to submit monthly reports of current-year\
    \ ISA subscription data. \nDuring the Alpha phase, your organisation must be approved\
    \ by HMRC as an ISA manager to access the API. \nFrom the Beta phase onwards,\
    \ your organisation must also be enrolled for digital ISA reporting.\n\n# Supported\
    \ use cases\n- Submit monthly reports with a cumulative total made up of current-year\
    \ subscription data, including transfers and withdrawals.\n- Check the status\
    \ of submitted reports to confirm they have been processed.\n- Retrieve reconciliation\
    \ results using batch pagination.\n\n# Integration requirements\n- REST API using\
    \ JSON over HTTPS.\n- Each report must cover activity from the 6th of one month\
    \ to the 5th of the next.\n- You must submit your monthly report between the 6th\
    \ and 23:59 on the 19th.\n- Authentication uses the OAuth 2.0 client credentials\
    \ grant.\n- All API calls require a unique identifier (Z-Reference) assigned by\
    \ HMRC to each approved ISA manager.\n\n# Support\nIf you need help, complete\
    \ the [support form](https://developer.service.hmrc.gov.uk/developer/support).\
    \ \nHMRC's Software Developers Support Team will reply within two working days.\n"
  version: 1.0.0
servers:
- url: https://test-api.service.hmrc.gov.uk/obligations/declaration/isa/return
  description: Sandbox
- url: https://api.service.hmrc.gov.uk/obligations/declaration/isa/return
  description: Production
tags:
- name: Submit monthly report
  description: "To submit a monthly report, you must follow a two-step process:\n\
    1. Submit one or more batches of account records.\n2. Mark the report as complete\
    \ after all account records have been submitted.\n\nBoth steps must be completed\
    \ in order. \nA report is considered submitted only after it has been marked as\
    \ complete, and it cannot be amended after submission.\n"
- name: Check report results
  description: "After a monthly report is marked complete and the reporting window\
    \ closes, \nHMRC will begin a process that reconciles your submission against\
    \ other ISA managers' submissions. \nThis will involve validation against business\
    \ rules and checks on each investor's eligibility \nand their annual ISA subscription\
    \ limits.\n\nYou can check the status of a submitted report and retrieve the reconciliation\
    \ results when available. \nReconciliation results include accepted records and\
    \ details of any reconciliation issues. \nResults are paginated to support large\
    \ datasets.\n"
paths:
  /monthly/{zReference}/{taxYear}/{month}:
    post:
      tags:
      - Submit monthly report
      summary: Submit monthly report data
      description: "Use this endpoint to upload a batch of account records. \nA batch\
        \ is a single payload containing multiple records for the specified monthly\
        \ report. \nThe payload size of each request must not exceed 10 MB. \n\nThe\
        \ API checks whether the reporting window is open and whether a report has\
        \ already \nbeen submitted for the specified tax year and report month. \n\
        If either condition is not met, the API returns a `403 Forbidden` response.\n\
        \nIf the request is permitted:\n- the payload is validated against the expected\
        \ structure to prevent invalid or incomplete data from being submitted\n-\
        \ business validation rules are not applied at this stage\n\nIf structural\
        \ validation fails, the API returns a `400 Bad Request` response. \nFor example,\
        \ a missing National Insurance number or account number will cause the request\
        \ to fail. \nValid records will be processed only after the report is marked\
        \ as complete.\n\nA successful submission returns a `204 No Content` response.\
        \ \n\nSubmit all data batches before completing the monthly report.\n\n**Note:**\
        \ The examples shown here are limited by the OpenAPI Specification. \nActual\
        \ payloads must be sent as newline-delimited JSON (NDJSON), with one object\
        \ per line. \nA trailing newline is optional. See https://github.com/ndjson/ndjson-spec\
        \ for full format guidance.\n"
      operationId: submitMonthlyReport
      parameters:
      - name: zReference
        in: path
        description: |
          A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[z|Z][0-9]{4}$"
          type: string
          example: Z1234
      - name: taxYear
        in: path
        description: |
          Tax year of the report.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^20\\d{2}-\\d{2}$"
          format: string
          example: 2025-26
      - name: month
        in: path
        description: |
          Month of the report.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: APR
          enum:
          - JAN
          - FEB
          - MAR
          - APR
          - MAY
          - JUN
          - JUL
          - AUG
          - SEP
          - OCT
          - NOV
          - DEC
      - name: Accept
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: Bearer token for authentication.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: array
              items:
                title: Investor Details
                type: object
                anyOf:
                - required:
                  - accountNumber
                  - amountTransferredIn
                  - amountTransferredOut
                  - dateOfBirth
                  - dateOfFirstSubscription
                  - dateOfLastSubscription
                  - firstName
                  - isaType
                  - lastName
                  - lisaBonusClaim
                  - lisaQualifyingAddition
                  - marketValueOfAccount
                  - nino
                  - totalCurrentYearSubscriptionsToDate
                  type: object
                  properties:
                    accountNumber:
                      type: string
                      description: The account number of the ISA account.
                      example: "12345678"
                    nino:
                      pattern: "^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$"
                      type: string
                      description: The National Insurance number of the account holder.
                      example: AB123456C
                    firstName:
                      type: string
                      description: The first name of the account holder.
                      example: John
                    middleName:
                      type: string
                      description: The middle name of the account holder.
                    lastName:
                      type: string
                      description: The last name of the account holder.
                      example: Smith
                    dateOfBirth:
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      type: string
                      description: The date of birth of the account holder (YYYY-MM-DD).
                      format: date
                      example: 1980-01-01
                    amountTransferredIn:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: Total value transferred in.
                      format: double
                      example: 3000.0
                    amountTransferredOut:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: Total value transferred out.
                      format: double
                      example: 3000.0
                    dateOfLastSubscription:
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      type: string
                      description: Date of last subscription to the ISA account (YYYY-MM-DD).
                      format: date
                      example: 2025-05-01
                    totalCurrentYearSubscriptionsToDate:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: Total value of current-year subscriptions to the
                        ISA account.
                      format: double
                      example: 5000.0
                    marketValueOfAccount:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: The market value of the ISA account.
                      format: double
                      example: 10000.0
                    isaType:
                      type: string
                      description: The type of ISA account.
                      example: LIFETIME
                      enum:
                      - LIFETIME
                    dateOfFirstSubscription:
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      type: string
                      description: Date of first subscription to the ISA account (YYYY-MM-DD).
                      format: date
                      example: 2025-04-06
                    lisaQualifyingAddition:
                      pattern: "^-?\\d+\\.\\d{2}$"
                      type: number
                      description: The amount of the current subscription that qualifies
                        for a LISA bonus.
                      format: double
                      example: 1000.0
                    lisaBonusClaim:
                      pattern: "^-?\\d+\\.\\d{2}$"
                      type: number
                      description: The amount being claimed as a LISA bonus.
                      format: double
                      example: 1000.0
