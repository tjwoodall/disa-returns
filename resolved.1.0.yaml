openapi: 3.0.3
info:
  title: ISA Returns API
  description: "# Overview\nUse this API to submit monthly reports of cumulative current\
    \ tax year ISA subscription data.\nYour organisation must be approved by HMRC\
    \ as an ISA manager to access the API.\nFrom the Beta phase onwards, your organisation\
    \ must also be enrolled for digital ISA reporting.\n\n# Supported use cases\n\n\
    You can use this API to:\n\n- submit monthly reports containing cumulative current\
    \ tax year subscription data, including transfers and withdrawals\n- submit a\
    \ declaration confirming that the data for the current reporting window has been\
    \ submitted\n- retrieve reconciliation results using cursor pagination\n\n# Integration\
    \ requirements\n\nThe integration requirements are as follows:\n\n- REST API using\
    \ JSON and [Newline Delimited JSON (NDJSON)](https://github.com/ndjson/ndjson-spec)\
    \ over HTTPS\n- each monthly report must be generated to cover all ISA subscription\
    \ activity from the 6th of one month through \nthe 5th of the following month\n\
    - you must submit the monthly report between the 6th and the 19th (by 23:59) of\
    \ the specific month in which the \nreporting period ends\n- authentication uses\
    \ the OAuth 2.0 authorization code grant\n- all API calls require an HMRC-assigned\
    \ unique identifier (Z-Reference) for each approved ISA manager\n\n# Support\n\
    \nBefore contacting us, find out if there is planned API downtime or a technical\
    \ issue by checking \n[HMRC API Platform Status](https://api-platform-status.production.tax.service.gov.uk/).\n\
    \nFor support with onboarding, the API access, or the \n[HMRC Developer sandbox](https://developer.service.hmrc.gov.uk/api-documentation/docs/testing)\
    \ \nqueries, submit your request using the \n[online support form](https://developer.service.hmrc.gov.uk/devhub-support/start)\
    \ \nor email your queries to [SDSTeam@hmrc.gov.uk](mailto:SDSTeam@hmrc.gov.uk).\n\
    \nWhen submitting a request, users should provide details of any available error\
    \ information to help with the \ntroubleshooting and resolution of the issue.\n"
  version: 1.0.0
servers:
- url: https://test-api.service.hmrc.gov.uk/obligations/declaration/isa/return
  description: Sandbox
- url: https://api.service.hmrc.gov.uk/obligations/declaration/isa/return
  description: Production
tags:
- name: Submit monthly report
  description: "To submit a monthly report with data records, you must follow a two-step\
    \ process:\n\n1. Submit one or more batches of account records.\n2. Declare the\
    \ monthly report as complete after all account records have been submitted.\n\n\
    You must complete these steps in order. A report is only considered submitted\
    \ once you have declared it complete. \nYou cannot amend the monthly report once\
    \ the declaration has been submitted.\n\n**Note:**\nWhen there is no data to submit\
    \ for a specific period, you may submit a nil report. It acts as a declaration\
    \ \nalongside the general declaration and will override any previous submission\
    \ for the same period.\n"
- name: Check report results
  description: "After a monthly report is marked complete and the reporting window\
    \ closes, HMRC will begin a process that \nreconciles your submission against\
    \ other ISA managers' submissions. This will involve validation against business\
    \ \nrules and checks on each investor's eligibility and their annual ISA subscription\
    \ limits.\n\nYou can use the ‘Get report reconciliation results’ endpoint to retrieve\
    \ the reconciliation results when the \nreport is available. This report is a\
    \ compilation of the rejected records with details of any reconciliation \nissues.\
    \ Results are cursor paginated to support large datasets.\n"
paths:
  /monthly/{zReference}:
    post:
      tags:
      - Submit monthly report
      summary: Submit monthly report data
      description: "Use the ‘Submit monthly report data‘ endpoint to upload a batch\
        \ of account records. A batch is a single payload \ncontaining multiple records\
        \ for the specified monthly report. The payload size of each request must\
        \ not exceed \n10 MB.\n\nThe API checks whether:\n\n- the reporting window\
        \ is closed\n- a declaration has already been submitted for the current reporting\
        \ period\n\nIf either of the above conditions are satisfied, then the API\
        \ returns a `403 Forbidden` response.\n\nIf the request to submit the monthly\
        \ report is permitted, then:\n\n- the payload is validated against the expected\
        \ structure to prevent invalid or incomplete data from being \nsubmitted\n\
        - business validation rules are not applied at this stage\n  \nIf structural\
        \ validation fails, the API returns a `400 Bad Request` response. For example,\
        \ a missing National \nInsurance number or account number will cause the request\
        \ to fail. Valid records will be processed only after \nthe report is marked\
        \ as complete.\n  \nA successful submission returns a `204 No Content` response.\n\
        \  \nSubmit all data batches before completing the monthly report.\n\nNote:\
        \ The examples shown here are limited by the OpenAPI Specification. Actual\
        \ payloads must be sent as \n[NDJSON](https://github.com/ndjson/ndjson-spec),\
        \ with one object per line. A trailing newline is optional.\n"
      operationId: submitMonthlyReport
      parameters:
      - name: zReference
        in: path
        description: |
          A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[zZ][0-9]{4}$"
          type: string
          example: Z1234
      - name: Accept
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - application/vnd.hmrc.1.0+json
      - name: Authorization
        in: header
        description: Bearer token for authentication.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: array
              items:
                title: Investor Details
                type: object
                anyOf:
                - required:
                  - accountNumber
                  - amountTransferredIn
                  - amountTransferredOut
                  - dateOfBirth
                  - dateOfFirstSubscription
                  - dateOfLastSubscription
                  - firstName
                  - isaType
                  - lastName
                  - lisaBonusClaim
                  - lisaQualifyingAddition
                  - marketValueOfAccount
                  - nino
                  - totalCurrentYearSubscriptionsToDate
                  type: object
                  properties:
                    accountNumber:
                      type: string
                      description: The account number of the ISA account.
                      example: "12345678"
                    nino:
                      pattern: "^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$"
                      type: string
                      description: The National Insurance number of the account holder.
                      example: AB123456C
                    firstName:
                      type: string
                      description: The first name of the account holder.
                      example: John
                    middleName:
                      type: string
                      description: The middle name of the account holder.
                    lastName:
                      type: string
                      description: The last name of the account holder.
                      example: Smith
                    dateOfBirth:
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      type: string
                      description: The date of birth of the account holder (YYYY-MM-DD).
                      format: date
                      example: 1980-01-01
                    amountTransferredIn:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: Total value transferred in.
                      format: double
                      example: 3000.0
                    amountTransferredOut:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: Total value transferred out.
                      format: double
                      example: 3000.0
                    dateOfLastSubscription:
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      type: string
                      description: Date of last subscription to the ISA account (YYYY-MM-DD).
                      format: date
                      example: 2025-05-01
                    totalCurrentYearSubscriptionsToDate:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: Total value of current-year subscriptions to the
                        ISA account.
                      format: double
                      example: 5000.0
                    marketValueOfAccount:
                      pattern: "^\\d+\\.\\d{2}$"
                      type: number
                      description: The market value of the ISA account.
                      format: double
                      example: 10000.0
                    isaType:
                      type: string
                      description: The type of ISA account.
                      example: LIFETIME
                      enum:
                      - LIFETIME
                    dateOfFirstSubscription:
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      type: string
                      description: Date of first subscription to the ISA account (YYYY-MM-DD).
                      format: date
                      example: 2025-04-06
                    lisaQualifyingAddition:
                      pattern: "^-?\\d+\\.\\d{2}$"
                      type: number
                      description: The amount of the current subscription that qualifies
                        for a LISA bonus.
                      format: double
                      example: 1000.0
                    lisaBonusClaim:
